<title>Enzyme Agent Trace</title>
<meta name="description" content="An animated replay of the enzyme-discovery agent reasoning from target reaction to ranked candidates.">
<style>
:root{
  --ground:#f1f4f1; --surface:#ffffff; --surface2:#eaeee9; --ink:#17211d;
  --muted:#586761; --faint:#8b988f; --line:#dce2dd;
  --accent:#0f857a; --formation:#2b9a67; --stop:#bb4a37; --gate:#bd8317;
  --lit:#4a6fb5; --shadow:0 1px 2px rgba(20,40,32,.06),0 8px 24px rgba(20,40,32,.06);
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  --serif:"IBM Plex Serif",Georgia,"Times New Roman",serif;
}
:root:not([data-theme="light"]) @media (prefers-color-scheme: dark){}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ground:#0c1210; --surface:#141c18; --surface2:#1b2620; --ink:#e6ede8;
  --muted:#98a69f; --faint:#6d7b74; --line:#243128;
  --accent:#3cb6a6; --formation:#48bd83; --stop:#d97a63; --gate:#dda546;
  --lit:#7fa2df; --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  --ground:#0c1210; --surface:#141c18; --surface2:#1b2620; --ink:#e6ede8;
  --muted:#98a69f; --faint:#6d7b74; --line:#243128;
  --accent:#3cb6a6; --formation:#48bd83; --stop:#d97a63; --gate:#dda546;
  --lit:#7fa2df; --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);
  font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;text-wrap:balance;font-family:var(--serif)}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-bottom:120px}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;
  background:color-mix(in srgb,var(--ground) 88%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:12px 16px;display:flex;
  align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;gap:1px;margin-right:auto}
.brand h1{font-size:19px;font-weight:600;letter-spacing:-.01em}
.brand .sub{font-size:12px;color:var(--muted);font-family:var(--mono)}
.tabs{display:flex;gap:6px;background:var(--surface2);padding:4px;border-radius:11px}
.tab{border:0;background:transparent;color:var(--muted);font-family:var(--sans);
  font-size:13px;font-weight:600;padding:7px 13px;border-radius:8px;cursor:pointer;
  display:flex;align-items:center;gap:8px;transition:.18s}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.tab .dot{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.tab.good .dot{background:var(--formation)}
.tab.warn .dot{background:var(--gate)}
.tab.bad .dot{background:var(--stop)}
.tab.run .dot{background:var(--lit);animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.themebtn{border:1px solid var(--line);background:var(--surface);color:var(--muted);
  width:34px;height:34px;border-radius:9px;cursor:pointer;font-size:15px}

/* verdict strip */
.verdict{max-width:1180px;margin:14px auto 0;padding:0 16px}
.verdict-in{display:flex;gap:14px;align-items:center;flex-wrap:wrap;
  background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);
  border-radius:12px;padding:13px 16px;box-shadow:var(--shadow)}
.verdict-in.good{border-left-color:var(--formation)}
.verdict-in.bad{border-left-color:var(--stop)}
.verdict-in.warn{border-left-color:var(--gate)}
.verdict-in .vt{font-family:var(--serif);font-size:16px;font-weight:600}
.verdict-in .vd{color:var(--muted);font-size:13.5px}
.badge{font-family:var(--mono);font-size:11px;font-weight:600;padding:3px 9px;
  border-radius:20px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.badge.good{background:color-mix(in srgb,var(--formation) 16%,transparent);color:var(--formation)}
.badge.bad{background:color-mix(in srgb,var(--stop) 16%,transparent);color:var(--stop)}
.badge.run{background:color-mix(in srgb,var(--lit) 16%,transparent);color:var(--lit)}

/* main grid */
.grid{display:grid;grid-template-columns:290px 1fr;gap:22px;margin-top:18px}
@media(max-width:820px){.grid{grid-template-columns:1fr}.rail{position:static!important}}

/* left rail */
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 74px);align-self:start;
  display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:15px;box-shadow:var(--shadow)}
.card h3{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:var(--faint);font-family:var(--sans);margin-bottom:11px}
/* phase ladder */
.phases{display:flex;flex-direction:column;gap:2px}
.phase{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:8px;
  color:var(--faint);font-size:13.5px;font-weight:500;transition:.25s}
.phase .pn{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);
  display:grid;place-items:center;font-size:11px;font-family:var(--mono);flex:none}
.phase.done{color:var(--muted)}
.phase.done .pn{background:var(--accent);border-color:var(--accent);color:#fff}
.phase.active{color:var(--ink);font-weight:600;background:var(--surface2)}
.phase.active .pn{border-color:var(--accent);color:var(--accent);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
/* stat tiles */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.stat{background:var(--surface2);border-radius:10px;padding:10px 11px}
.stat .k{font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);font-weight:600}
.stat .v{font-family:var(--mono);font-size:22px;font-weight:600;line-height:1.1;margin-top:3px;
  font-variant-numeric:tabular-nums}
.stat.hero{grid-column:1/3}
.stat.hero .v{font-size:30px;color:var(--accent)}
.tokbar{height:6px;background:var(--surface2);border-radius:4px;overflow:hidden;margin-top:9px}
.tokbar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--formation));
  width:0;transition:width .4s}
.tokline{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;
  color:var(--muted);margin-top:5px}
/* reaction mini */
.rxn svg{width:100%;height:auto;display:block}
.rxncap{font-size:11.5px;color:var(--muted);margin-top:8px;text-align:center}

/* stream */
.stream{display:flex;flex-direction:column;gap:0;position:relative}
.beat{position:relative;padding:2px 0 2px 34px;opacity:1}
.beat::before{content:"";position:absolute;left:11px;top:0;bottom:0;width:2px;background:var(--line)}
.beat:last-child::before{bottom:auto;height:26px}
.beat .node{position:absolute;left:5px;top:20px;width:14px;height:14px;border-radius:50%;
  background:var(--surface);border:2px solid var(--faint);z-index:2}
.beat.k-gate .node{border-color:var(--gate)}
.beat.k-registered .node,.beat.k-family_decision .node{border-color:var(--formation)}
.beat.k-complete .node{border-color:var(--accent);background:var(--accent)}
.beat.k-warn .node{border-color:var(--stop)}
.bcard{background:var(--surface);border:1px solid var(--line);border-radius:13px;
  padding:13px 15px;margin:8px 0;box-shadow:var(--shadow);transition:.3s}
.beat.enter .bcard{animation:slidein .45s cubic-bezier(.2,.7,.3,1)}
@keyframes slidein{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.beat.current .bcard{border-color:color-mix(in srgb,var(--accent) 55%,var(--line));
  box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 14%,transparent),var(--shadow)}
.beat.upcoming{opacity:.4;filter:saturate(.5)}
.bhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.bkind{font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.04em;
  text-transform:uppercase;color:var(--faint);white-space:nowrap}
.beat.k-gate .bkind{color:var(--gate)}
.beat.k-tool .bkind{color:var(--accent)}
.beat.k-registered .bkind,.beat.k-family_decision .bkind{color:var(--formation)}
.beat.k-warn .bkind{color:var(--stop)}
.btitle{font-weight:600;font-size:15px;font-family:var(--serif);flex:1;min-width:200px}
.beat.k-tool .btitle{font-family:var(--mono);font-size:13.5px;font-weight:600}
.bclock{font-family:var(--mono);font-size:11px;color:var(--faint);margin-left:auto}
.bdetail{color:var(--muted);font-size:13.5px;margin-top:5px}
.beat.k-problem .bdetail,.beat.k-query .bdetail{color:var(--ink);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.chip{font-family:var(--mono);font-size:11px;padding:3px 8px;border-radius:7px;
  background:var(--surface2);color:var(--muted);border:1px solid transparent}
.chip.exp{background:color-mix(in srgb,var(--formation) 12%,transparent);
  color:var(--formation);border-color:color-mix(in srgb,var(--formation) 28%,transparent)}
.chip.stp{background:color-mix(in srgb,var(--stop) 10%,transparent);
  color:var(--stop);border-color:color-mix(in srgb,var(--stop) 25%,transparent);
  text-decoration:line-through;text-decoration-thickness:1px}
.chip.big{font-family:var(--sans);white-space:normal;line-height:1.35;text-align:left}
/* opening reaction figure inside a beat */
.rxnbig{margin-top:12px;background:var(--surface2);border-radius:11px;padding:16px 12px}
.rxnbig svg{width:100%;height:auto;display:block}
/* ranking payoff */
.rankwrap{margin-top:8px}
.rankrow{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:start;
  padding:11px 0;border-top:1px solid var(--line)}
.rankrow:first-child{border-top:0}
.rk{font-family:var(--mono);font-size:20px;font-weight:600;color:var(--accent);text-align:center;
  font-variant-numeric:tabular-nums}
.gene{font-family:var(--mono);font-weight:600;font-size:14px}
.acc{font-family:var(--mono);font-size:11px;color:var(--faint)}
.rat{color:var(--muted);font-size:12.5px;margin-top:3px}
.tier{font-family:var(--mono);font-size:10.5px;padding:3px 8px;border-radius:20px;
  background:var(--surface2);color:var(--muted);white-space:nowrap;align-self:center}
.tier.strong{background:color-mix(in srgb,var(--formation) 16%,transparent);color:var(--formation)}

/* transport */
.transport{position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(12px);
  border-top:1px solid var(--line);
  padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.tp-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.tbtn{border:1px solid var(--line);background:var(--surface);color:var(--ink);
  height:40px;min-width:40px;padding:0 12px;border-radius:10px;cursor:pointer;font-size:15px;
  display:grid;place-items:center;transition:.15s}
.tbtn:hover{border-color:var(--accent)}
.tbtn.play{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;
  padding:0 18px;gap:8px;display:flex;align-items:center}
.scrub{flex:1;min-width:160px;display:flex;align-items:center;gap:10px}
input[type=range]{flex:1;accent-color:var(--accent);height:4px}
.clock{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap;
  font-variant-numeric:tabular-nums}
.spd{display:flex;gap:3px;background:var(--surface2);padding:3px;border-radius:9px}
.spd button{border:0;background:transparent;color:var(--muted);font-family:var(--mono);
  font-size:11.5px;font-weight:600;padding:5px 8px;border-radius:6px;cursor:pointer}
.spd button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.tlabel{font-family:var(--mono);font-size:11px;color:var(--faint)}
@media(max-width:560px){.brand h1{font-size:16px}.bclock{display:none}}
</style>

<header class="top">
  <div class="top-in">
    <div class="brand">
      <h1>Enzyme Agent · Reasoning Trace</h1>
      <span class="sub" id="brandsub">target reaction → ranked candidates</span>
    </div>
    <div class="tabs" id="tabs" role="tablist"></div>
    <button class="themebtn" id="theme" title="Toggle theme">◐</button>
  </div>
</header>

<div class="verdict"><div class="verdict-in" id="verdict"></div></div>

<div class="wrap">
  <div class="grid">
    <aside class="rail">
      <div class="card">
        <h3>Phase</h3>
        <div class="phases" id="phases"></div>
      </div>
      <div class="card">
        <h3>Live state</h3>
        <div class="stats" id="stats"></div>
        <div class="tokbar"><i id="tokfill"></i></div>
        <div class="tokline"><span>tokens</span><span id="toktxt">0</span></div>
      </div>
      <div class="card rxn">
        <h3>Target reaction</h3>
        <div id="rxnmini"></div>
        <div class="rxncap">adipic acid + hexamethylenediamine → nylon-6,6 amide</div>
      </div>
    </aside>
    <main class="stream" id="stream"></main>
  </div>
</div>

<div class="transport">
  <div class="tp-in">
    <button class="tbtn" id="restart" title="Restart">⟲</button>
    <button class="tbtn" id="back" title="Step back">◀</button>
    <button class="tbtn play" id="play"><span id="playicon">▶</span><span id="playtxt">Play</span></button>
    <button class="tbtn" id="fwd" title="Step forward">▶</button>
    <div class="scrub">
      <input type="range" id="range" min="0" max="0" value="0" step="1">
      <span class="tlabel" id="beatcount">0 / 0</span>
    </div>
    <div class="spd" id="spd"></div>
    <span class="clock" id="clock">00:00</span>
  </div>
</div>

<script>
const RUNS = /*__PAYLOAD__*/;

/* ---------- molecule / reaction SVG (adipic acid + HMD -> amide) ---------- */
function reactionSVG(big){
  const c={ink:'currentColor'};
  // stylized skeletal zigzags with labeled termini; amide bonds emphasized in product
  const stroke = big?2.4:1.8, fs = big?13:10.5, ah=big?26:16;
  function zig(x,y,n,dir){ // n bonds, returns points string
    let pts=[[x,y]], cx=x, cy=y, d=dir;
    for(let i=0;i<n;i++){ cx+= (big?18:12); cy += d*(big?11:7); d=-d; pts.push([cx,cy]); }
    return pts;
  }
  if(!big){
    return `<svg viewBox="0 0 260 70" role="img" aria-label="reaction">
      <g fill="none" stroke="${c.ink}" stroke-width="${stroke}" stroke-linecap="round" stroke-linejoin="round" opacity=".85">
        <polyline points="10,40 22,32 34,40 46,32 58,40"/>
        <line x1="10" y1="40" x2="4" y2="48"/><line x1="58" y1="40" x2="64" y2="48"/>
      </g>
      <g font-family="var(--mono)" font-size="${fs}" fill="var(--muted)">
        <text x="2" y="30">HO₂C</text><text x="46" y="30">CO₂H</text>
        <text x="118" y="26">+</text>
        <text x="150" y="30">H₂N</text><text x="214" y="30">NH₂</text>
      </g>
      <g fill="none" stroke="${c.ink}" stroke-width="${stroke}" stroke-linecap="round" stroke-linejoin="round" opacity=".85">
        <polyline points="150,40 162,32 174,40 186,32 198,40 210,32 222,40"/>
      </g>
      <g stroke="var(--accent)" stroke-width="2"><line x1="96" y1="55" x2="230" y2="55"/></g>
      <text x="150" y="66" font-family="var(--mono)" font-size="9.5" fill="var(--accent)">ATP · Mg²⁺</text>
    </svg>`;
  }
  // big product-forming figure
  return `<svg viewBox="0 0 640 190" role="img" aria-label="amide bond formation">
    <style>.lbl{font-family:var(--mono);font-size:12px;fill:var(--muted)} .em{fill:var(--formation);font-weight:600}</style>
    <!-- adipic acid -->
    <g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" opacity=".9">
      <polyline points="30,70 52,56 74,70 96,56 118,70"/>
      <line x1="30" y1="70" x2="18" y2="84"/><line x1="18" y1="84" x2="18" y2="70" stroke="currentColor"/>
      <line x1="118" y1="70" x2="130" y2="84"/>
    </g>
    <text class="lbl" x="2" y="60">HO₂C</text><text class="lbl" x="120" y="60">CO₂H</text>
    <text class="lbl" x="40" y="98">adipic acid</text>
    <text x="150" y="72" font-family="var(--serif)" font-size="22" fill="var(--muted)">+</text>
    <!-- HMD -->
    <g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" opacity=".9">
      <polyline points="185,70 205,56 225,70 245,56 265,70 285,56 305,70"/>
    </g>
    <text class="lbl" x="176" y="60">H₂N</text><text class="lbl" x="298" y="60">NH₂</text>
    <text class="lbl" x="205" y="98">hexamethylenediamine</text>
    <!-- arrow -->
    <g><line x1="335" y1="66" x2="405" y2="66" stroke="var(--accent)" stroke-width="2.4"/>
       <polygon points="405,66 396,61 396,71" fill="var(--accent)"/></g>
    <text x="342" y="56" class="lbl" fill="var(--accent)">ATP · Mg²⁺</text>
    <text x="352" y="82" class="lbl" fill="var(--accent)">−AMP/PPi</text>
    <!-- product with amide bonds -->
    <g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" opacity=".9">
      <polyline points="430,150 448,138 466,150 484,138 502,150"/>
      <line x1="430" y1="150" x2="430" y2="134"/>
    </g>
    <!-- amide linkage 1 -->
    <g stroke="var(--formation)" stroke-width="3" stroke-linecap="round">
      <line x1="502" y1="150" x2="520" y2="138"/><line x1="520" y1="138" x2="520" y2="122"/>
      <line x1="520" y1="138" x2="538" y2="150"/></g>
    <text class="em" x="510" y="118">O</text><text class="em" x="540" y="146">N<tspan dy="4" font-size="9">H</tspan></text>
    <!-- diamine spacer -->
    <g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" opacity=".9">
      <polyline points="548,150 566,138 584,150 602,138"/></g>
    <line x1="430" y1="150" x2="418" y2="150" stroke="currentColor" stroke-width="2.4" stroke-dasharray="2 3"/>
    <line x1="602" y1="138" x2="614" y2="138" stroke="currentColor" stroke-width="2.4" stroke-dasharray="2 3"/>
    <text x="320" y="184" text-anchor="middle" class="lbl" font-size="12.5">
      [ −OC−(CH₂)₄−CO−<tspan class="em">NH</tspan>−(CH₂)₆−<tspan class="em">NH</tspan>− ]<tspan dy="4" font-size="9">n</tspan> · nylon-6,6</text>
  </svg>`;
}

/* ---------- player ---------- */
const PHASES=[["contract","Contract"],["reaction_analysis","Reaction analysis"],
  ["discovery","Discovery"],["ranking_and_report","Ranking & report"]];
const KIND_LABEL={query:"target",substrate:"substrate",contract:"contract",problem:"problem",
  strategies:"strategy",disqualify:"disqualifiers",decision:"decide",tool:"tool",
  registered:"register",gate:"gate",family_decision:"triage",screened:"screen",
  evaluated:"evaluate",warn:"retry",citation:"verify",complete:"done"};

let curRun=null, cur=0, playing=false, timer=null, speed=1;
const $=id=>document.getElementById(id);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

function fmtClock(ms){const s=Math.round(ms/1000);const m=Math.floor(s/60);
  return String(m).padStart(2,'0')+":"+String(s%60).padStart(2,'0');}

function verdictFor(run){
  const m=run.meta;
  if(m.running) return {kind:'run',t:'Run in progress',d:m.blurb,badge:'live'};
  const c=m.candidates;
  const kind=m.verdict_kind||'warn';
  return {kind, t:m.verdict||(c!=null?c+' candidates':'completed'), d:m.blurb,
     badge:(c!=null?c+' candidates':'done')};
}

function renderTabs(){
  const t=$('tabs'); t.innerHTML='';
  for(const [id,run] of Object.entries(RUNS)){
    const v=verdictFor(run);
    const b=document.createElement('button');
    b.className='tab '+(v.kind==='run'?'run':v.kind);
    b.setAttribute('role','tab');
    b.setAttribute('aria-selected', id===curRunId);
    b.innerHTML=`<span class="dot"></span>${run.meta.label}`;
    b.onclick=()=>selectRun(id);
    t.appendChild(b);
  }
}

let curRunId=null;
function selectRun(id){
  curRunId=id; curRun=RUNS[id];
  pause();
  renderTabs();
  // verdict
  const v=verdictFor(curRun);
  const ve=$('verdict'); ve.className='verdict-in '+v.kind;
  ve.innerHTML=`<span class="vt">${v.t}</span><span class="vd">${v.d}</span>
    <span class="badge ${v.kind}" style="margin-left:auto">${v.badge}</span>
    <span class="badge">${curRun.meta.model||''}</span>`;
  buildStream();
  cur=0; $('range').max=curRun.beats.length-1; $('range').value=0;
  render();
}

function buildStream(){
  const s=$('stream'); s.innerHTML='';
  curRun.beats.forEach((b,i)=>{
    const el=document.createElement('div');
    el.className='beat k-'+b.kind; el.dataset.i=i;
    let chips='';
    if(b.kind==='family_decision'){
      const exp=(b.expand||[]).map(([f,r])=>`<span class="chip exp big" title="${esc(f)}">${esc(shortReason(r)||f)}</span>`).join('');
      const stp=(b.stop||[]).map(([f,r])=>`<span class="chip stp big" title="${esc(f)}">${esc(shortReason(r)||f)}</span>`).join('');
      chips=`<div class="chips">${exp}${stp}</div>`;
    } else if(b.chips&&b.chips.length){
      chips='<div class="chips">'+b.chips.map(c=>`<span class="chip ${c.length>28?'big':''}">${esc(c)}</span>`).join('')+'</div>';
    }
    let extra='';
    if(b.kind==='substrate') extra=`<div class="rxnbig">${reactionSVG(true)}</div>`;
    if(b.kind==='complete') extra=rankingHTML();
    el.innerHTML=`<div class="node"></div><div class="bcard">
      <div class="bhead"><span class="bkind">${KIND_LABEL[b.kind]||b.kind}</span>
        <span class="btitle">${esc(b.title)}</span>
        <span class="bclock">${b.iter?('it'+b.iter+' · '):''}${fmtClock(b.ms)}</span></div>
      ${b.detail?`<div class="bdetail">${esc(b.detail)}</div>`:''}
      ${chips}${extra}</div>`;
    s.appendChild(el);
  });
}
function shortReason(r){ if(!r) return ''; r=r.split(';')[0].split(' - ')[0].split(' (')[0];
  return r.length>46?r.slice(0,44)+'…':r; }
function rankingHTML(){
  if(!curRun.ranking||!curRun.ranking.length) return '';
  const rows=curRun.ranking.map(r=>`<div class="rankrow">
    <div class="rk">${r.rank}</div>
    <div><span class="gene">${esc(r.gene||'?')}</span> <span class="acc">${esc(r.accession||'')}</span>
      ${r.fit!=null?`<span class="acc">· fit ${r.fit}</span>`:''}
      <div class="rat">${esc(r.rationale||'')}</div></div>
    <span class="tier ${/strong/i.test(r.tier||'')?'strong':''}">${esc(r.tier||'')}</span></div>`).join('');
  return `<div class="rankwrap"><h3 style="font-family:var(--sans);font-size:12px;letter-spacing:.06em;
    text-transform:uppercase;color:var(--faint);margin:6px 0 2px">Final ranking (top ${curRun.ranking.length})</h3>${rows}</div>`;
}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));}

function render(){
  const beats=curRun.beats, b=beats[cur]||beats[0];
  // stream reveal
  document.querySelectorAll('.beat').forEach((el,i)=>{
    el.classList.toggle('upcoming', i>cur);
    el.classList.toggle('current', i===cur);
    el.style.display = i<=cur ? '' : (i<=cur+2 ? '' : 'none'); // keep 2 dim upcoming for context
  });
  const curEl=document.querySelector('.beat[data-i="'+cur+'"]');
  if(curEl){
    if(!reduce){curEl.classList.remove('enter');void curEl.offsetWidth;curEl.classList.add('enter');}
    curEl.scrollIntoView({behavior:reduce?'auto':'smooth',block:'center'});
  }
  // phases
  const pi=PHASES.findIndex(p=>p[0]===b.phase);
  $('phases').innerHTML=PHASES.map((p,i)=>{
    const cls=i<pi?'done':(i===pi?'active':'');
    return `<div class="phase ${cls}"><span class="pn">${i<pi?'✓':i+1}</span>${p[1]}</div>`;
  }).join('');
  // stats
  const st=b.state;
  $('stats').innerHTML=`
    <div class="stat hero"><div class="k">candidates</div><div class="v">${st.cands}</div></div>
    <div class="stat"><div class="k">expanded</div><div class="v">${st.expand}</div></div>
    <div class="stat"><div class="k">stopped</div><div class="v">${st.stop}</div></div>
    <div class="stat"><div class="k">screened</div><div class="v">${st.screened}</div></div>
    <div class="stat"><div class="k">evaluated</div><div class="v">${st.evaluated}</div></div>`;
  const maxtok=Math.max(1,curRun.beats[curRun.beats.length-1].state.tokens);
  $('tokfill').style.width=(100*st.tokens/maxtok)+'%';
  $('toktxt').textContent=st.tokens.toLocaleString();
  // transport
  $('range').value=cur;
  $('beatcount').textContent=(cur+1)+' / '+beats.length;
  $('clock').textContent=fmtClock(b.ms);
}

function step(d){ const n=curRun.beats.length; cur=Math.max(0,Math.min(n-1,cur+d));
  if(cur>=n-1) pause(); render(); }
function play(){ if(cur>=curRun.beats.length-1) cur=0;
  playing=true; $('playicon').textContent='❚❚'; $('playtxt').textContent='Pause';
  clearInterval(timer); timer=setInterval(()=>{ if(cur>=curRun.beats.length-1){pause();return;} step(1);}, 1100/speed);}
function pause(){ playing=false; clearInterval(timer);
  $('playicon').textContent='▶'; $('playtxt').textContent='Play';}
function toggle(){ playing?pause():play(); }

$('play').onclick=toggle;
$('fwd').onclick=()=>{pause();step(1);};
$('back').onclick=()=>{pause();step(-1);};
$('restart').onclick=()=>{pause();cur=0;render();};
$('range').oninput=e=>{pause();cur=+e.target.value;render();};
$('theme').onclick=()=>{const r=document.documentElement;
  const cur=r.getAttribute('data-theme');
  const next=cur==='dark'?'light':(cur==='light'?'dark':(matchMedia('(prefers-color-scheme: dark)').matches?'light':'dark'));
  r.setAttribute('data-theme',next);};
document.addEventListener('keydown',e=>{
  if(e.key===' '){e.preventDefault();toggle();}
  else if(e.key==='ArrowRight'){pause();step(1);}
  else if(e.key==='ArrowLeft'){pause();step(-1);}});

// speed control
const SPD=[0.5,1,2,4];
$('spd').innerHTML=SPD.map(s=>`<button data-s="${s}" aria-pressed="${s===1}">${s}×</button>`).join('');
$('spd').onclick=e=>{const b=e.target.closest('button'); if(!b)return;
  speed=+b.dataset.s;
  [...$('spd').children].forEach(x=>x.setAttribute('aria-pressed',x===b));
  if(playing){clearInterval(timer);timer=setInterval(()=>{if(cur>=curRun.beats.length-1){pause();return;}step(1);},1100/speed);}};

// reaction mini
$('rxnmini').innerHTML=reactionSVG(false);
// boot (optional deep-link: #run=aug30&b=40)
const hp=new URLSearchParams(location.hash.slice(1));
curRunId = (hp.get('run') && RUNS[hp.get('run')]) ? hp.get('run') : Object.keys(RUNS)[0];
selectRun(curRunId);
if(hp.get('b')){ cur=Math.max(0,Math.min(curRun.beats.length-1,+hp.get('b'))); render(); }
</script>
