[project]
name = "enzyme-discovery-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0",
    "pandas",
    "rdkit",
    "biopython",
    "requests",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
]
scoring = [
    "torch>=2.0",
    "torch-geometric",
    "drfp",
]

[tool.setuptools.packages.find]
include = ["enzyme_discovery_agent*"]

[project.scripts]
enzyme-discovery-agent = "enzyme_discovery_agent.__main__:main"
