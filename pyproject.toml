[project]
name = "enzyme-discovery-agent"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0",
    "pandas",
    "rdkit",
    "biopython",
    "requests",
    "pymupdf>=1.23",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
]
scoring = [
    "torch>=2.0",
    "torch-geometric",
    "drfp",
]
# Semantic re-ranking (RRF fusion over embeddings). Previously an UNDECLARED
# import that silently no-oped where missing; now an explicit optional extra.
# numpy comes via pandas (a core dep); scikit-learn is no longer needed
# (cosine is a dot product on normalized embeddings).
rerank = [
    "sentence-transformers>=2.2",
]
# Agent-invoked candidate ESM-embedding map (map_candidate_neighbors tool +
# candidate_map_plot). The heavy ESM forward pass runs in a SEPARATE GPU
# subprocess (tools/esm_embed_worker.py) via fair-esm -- loads ESM2 weights
# through torch.hub, needing neither transformers nor huggingface_hub -- so it is
# typically installed in a dedicated env layered on the main one (see
# docs/PROJECT_LAYOUT.md). umap-learn/scikit-learn/matplotlib drive the 2-D
# projection + figure; numpy comes via pandas (a core dep).
embedding-map = [
    "fair-esm>=2.0",
    "torch>=2.0",
    "umap-learn>=0.5",
    "scikit-learn>=1.1",
    "matplotlib>=3.5",
]
[tool.setuptools.packages.find]
include = ["enzyme_discovery_agent_improved*"]

[project.scripts]
enzyme-discovery-agent = "enzyme_discovery_agent_improved.__main__:main"
